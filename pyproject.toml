[project]
name = "daily-ritual"
version = "0.1.0"
description = "FastAPI Backend for Daily Ritual Workout & Habit Tracker"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "sqlmodel>=0.0.14",
    "PyJWT>=2.8.0",
    "werkzeug>=3.0.1",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
